[project]
name = "credit-risk-mlops"
version = "1.0.0"
description = "End-to-end credit default risk pipeline: validated data, calibrated LightGBM, cost-sensitive decisions, fairness audit, drift monitoring and a FastAPI scoring service."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "joblib>=1.4",
    "lightgbm>=4.5",
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Everything needed to train, track and analyse models (not needed to serve the API).
train = [
    "matplotlib>=3.9",
    "mlflow>=2.16",
    "optuna>=4.0",
    "pandera>=0.20",
    "requests>=2.32",
    "shap>=0.46",
]

[project.scripts]
credit-risk-train = "credit_risk.train:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_risk"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "NPY", "PD"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402", "E501", "B018"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=credit_risk --cov-report=term-missing"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
